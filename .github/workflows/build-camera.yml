name: Build Camera APK

on:
  push:
    paths:
      - 'Camera-APK-Ready.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack Android project
        run: unzip -q Camera-APK-Ready.zip -d project

      - name: Build debug APK
        working-directory: project/Camera
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-debug-APK
          path: project/Camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
